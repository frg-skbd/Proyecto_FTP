
listen=YES
listen_ipv6=NO

# Acceso anónimo de solo lectura
anonymous_enable=YES
no_anon_password=YES
anon_root=/var/ftp
anon_world_readable_only=YES
anon_upload_enable=NO
anon_mkdir_write_enable=NO
allow_anon_ssl=NO

# Usuarios locales
local_enable=YES
write_enable=YES
local_umask=022
file_open_mode=0666

# Aislamiento de directorios
chroot_local_user=YES
allow_writeable_chroot=NO
user_config_dir=/etc/vsftpd_user_conf

# Operaciones FTP
download_enable=YES
dirlist_enable=YES
use_localtime=YES
xferlog_enable=YES

# Modo pasivo
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110
pasv_address=192.168.10.10

# Cifrado FTPS explícito
ssl_enable=YES
rsa_cert_file=/etc/ssl/private/server.pem
rsa_private_key_file=/etc/ssl/private/server.key

force_local_logins_ssl=YES
force_local_data_ssl=YES

ssl_sslv2=NO
ssl_sslv3=NO

# Compatibilidad con el contenedor
seccomp_sandbox=NO

# Compatibilidad FTPS con clientes que no reutilizan la sesión TLS
require_ssl_reuse=NO