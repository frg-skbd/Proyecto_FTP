services:
  ftp:
    build:
      context: ./ftp
    container_name: Proyecto_FTP
    restart: unless-stopped
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    volumes:
      - ./data/compartido:/var/ftp:ro
      - ./data/usuarios/alumno1:/home/alumno1/archivos
      - ./data/usuarios/alumno2:/home/alumno2/archivos
    networks:
      ftp_lab:
        ipv4_address: 192.168.10.10

  filezilla-web:
    image: jlesage/filezilla:latest
    container_name: Proyecto_FTP_Web
    restart: unless-stopped
    ports:
      - "5800:5800"
    volumes:
      - ./web/configuracion-web:/config:rw
      - ./web/archivos:/storage:rw
    networks:
      - ftp_lab
    depends_on:
      - ftp

networks:
  ftp_lab:
    name: proyecto-ftp-red
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.10.0/24
          gateway: 192.168.10.1
